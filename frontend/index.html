<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twin AI – Protected</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🧠 Twin AI</h1>
    <p class="subtitle">Password‑protected · DeepSeek · Memory</p>

    <div class="password-area">
      <label for="api-password">🔑 Password:</label>
      <input type="password" id="api-password" placeholder="Enter your secret password..." />
    </div>

    <div id="chat-box" class="chat-box"></div>

    <div class="input-area">
      <input type="text" id="message-input" placeholder="Talk to your twin..." />
      <button id="send-btn">Send</button>
    </div>

    <div class="user-id-area">
      <label for="user-id">User ID:</label>
      <input type="text" id="user-id" value="twin1" />
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
