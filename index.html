<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Memory – Personalized AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== PASSWORD SCREEN ===== -->
  <div id="password-screen" class="password-screen">
    <div class="password-box">
      <h1>🧠 DeepSeek Memory</h1>
      <p><em>Modified DeepSeek AI with long‑term memory</em></p>
      <input type="password" id="password-input" placeholder="Password..." />
      <button id="password-btn">Unlock</button>
      <div id="password-error" class="error-message"></div>
    </div>
  </div>

  <!-- ===== MAIN APP ===== -->
  <div id="app" class="app hidden">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>🧠 DeepSeek Memory</h2>
        <p>Modified DeepSeek AI with long‑term memory</p>
        <button id="new-chat-btn" class="new-chat-btn">+ New Chat</button>
      </div>
      <div class="chat-list" id="chat-list"></div>
      <div class="sidebar-footer">
        <button id="logout-btn" class="logout-btn">🚪 Logout</button>
      </div>
    </aside>

    <!-- Main chat area -->
    <main class="main-chat">
      <div class="chat-header">
        <h3 id="chat-title">New Chat</h3>
        <div class="header-actions">
          <button id="settings-toggle-btn" class="settings-toggle" title="Personalize your AI">⚙️</button>
          <button id="delete-chat-btn" class="delete-btn" title="Delete this chat">🗑️</button>
        </div>
      </div>

      <!-- Settings Panel -->
      <div id="settings-panel" class="settings-panel hidden">
        <div class="settings-content">
          <h4>🧠 Personalize Your AI</h4>
          <p>Set a custom system prompt to define your AI's personality, expertise, or behavior. Guardrails will still apply.</p>
          <textarea id="custom-prompt-input" placeholder="Enter your custom system prompt here..."></textarea>
          <div class="settings-actions">
            <button id="save-prompt-btn" class="save-prompt-btn">💾 Save Prompt</button>
            <button id="reset-prompt-btn" class="reset-prompt-btn">↩️ Reset to Default</button>
          </div>
          <div id="prompt-feedback" class="prompt-feedback"></div>
        </div>
      </div>

      <div class="messages-container" id="messages-container"></div>
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Ask DeepSeek Memory anything..." />
        <button id="send-btn">Send</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
