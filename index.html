<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twin AI – DeepSeek Style</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- PASSWORD SCREEN -->
  <div id="password-screen" class="password-screen">
    <div class="password-box">
      <h1>🔐 Twin AI</h1>
      <p>Enter your password to access your personal AI</p>
      <input type="password" id="password-input" placeholder="Password..." />
      <button id="password-btn">Unlock</button>
      <div id="password-error" class="error-message"></div>
    </div>
  </div>

  <!-- MAIN CHAT UI (hidden until password is correct) -->
  <div id="app" class="app hidden">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>🧠 Twin AI</h2>
        <button id="new-chat-btn" class="new-chat-btn">+ New Chat</button>
      </div>
      <div class="chat-list" id="chat-list">
        <!-- Chat history items will be injected here -->
      </div>
      <div class="sidebar-footer">
        <button id="logout-btn" class="logout-btn">🚪 Logout</button>
      </div>
    </aside>

    <!-- Main chat area -->
    <main class="main-chat">
      <div class="chat-header">
        <h3 id="chat-title">New Chat</h3>
        <button id="delete-chat-btn" class="delete-btn" title="Delete this chat">🗑️</button>
      </div>
      <div class="messages-container" id="messages-container">
        <!-- Messages will appear here -->
      </div>
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Ask your twin anything..." />
        <button id="send-btn">Send</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
